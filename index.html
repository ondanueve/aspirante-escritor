<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspirante a Escritor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Aspirante a Escritor</h1>
      <div id="time">Semana 1</div>
      <div id="status-bar"></div>
    </header>
    <div class="main">
      <section id="stats" class="panel">
        <h2>Estado</h2>
        <div id="stats-content"></div>
      </section>
      <section id="personal" class="panel">
        <h2>Desarrollo Personal</h2>
        <div id="personal-content"></div>
      </section>
      <section id="actions" class="panel">
        <h2>Acciones</h2>
        <div id="actions-content"></div>
      </section>
      <section id="portfolio" class="panel">
        <h2>Obras, Contratos y Biblioteca</h2>
        <div id="portfolio-content"></div>
      </section>
    </div>
    <section id="log" class="panel">
      <h2>Diario de vida</h2>
      <div id="log-content"></div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
